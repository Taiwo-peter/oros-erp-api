name: Build & Deploy ERP API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SERVICE_NAME: erp-api
  SERVICE_PORT: 5003
  SERVICE_DB: oros_erp
  REGISTRY_OWNER: taiwo-peter       # ← Change to GitHub username/org (MUST be lowercase)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test -B -Dspring.profiles.active=test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oros-${{ env.SERVICE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/oros-${{ env.SERVICE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SERVICE_NAME,SERVICE_PORT,SERVICE_DB
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository_owner }}/oros-${SERVICE_NAME}:latest

            docker stop oros-${SERVICE_NAME} 2>/dev/null || true
            docker rm oros-${SERVICE_NAME} 2>/dev/null || true

            source /opt/oros-platform/.env

            docker run -d \
              --name oros-${SERVICE_NAME} \
              --network oros-net \
              --restart unless-stopped \
              -p ${SERVICE_PORT}:5000 \
              -e SPRING_APPLICATION_NAME=${SERVICE_NAME} \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://oros-postgres:5432/${SERVICE_DB} \
              -e SPRING_DATASOURCE_USERNAME=${POSTGRES_USER} \
              -e SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD} \
              -e SPRING_REDIS_HOST=oros-redis \
              -e SPRING_REDIS_PORT=6379 \
              -e SPRING_REDIS_PASSWORD=${REDIS_PASSWORD} \
              -e KAFKA_BOOTSTRAP_SERVERS=oros-kafka:9092 \
              -e KEYCLOAK_URL=http://oros-keycloak:8080 \
              -e KEYCLOAK_REALM=oros \
              ghcr.io/${{ github.repository_owner }}/oros-${SERVICE_NAME}:latest

            sleep 15
            curl -sf http://localhost:${SERVICE_PORT}/health && echo "ERP API deployed successfully" || echo "Health check failed"
